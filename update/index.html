<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" noindex>
<title>边界生存 · 更新日志</title>
<meta http-equiv="refresh" content="0; url=../index.html?mode=update">
<link rel="canonical" href="../index.html?mode=update">
<script>
/* 存根页：把 /update 路径翻译成 index.html 的 ?mode=update 查询参数，
   截掉末尾的 /update（含有无尾斜杠两种情况）以兼容 GitHub Pages 的目录重定向。 */
(function(){
  var base=location.pathname.replace(/\/+$/,'').replace(/\/(en|update)$/i,'/');
  location.replace(base+'index.html?mode=update');
})();
</script>
</head>
<body>
<p>正在跳转到更新日志… <a href="../index.html?mode=update">若无反应请点此</a>。</p>
</body>
</html>
